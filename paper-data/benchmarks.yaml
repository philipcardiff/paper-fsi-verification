# Machine-readable twin of benchmark_inventory.md.
# Every value traces to a solids4foam file, PR description/comment, or this
# repository's simulationData/. Keys "derived_here" and "read_from_plot" flag
# values computed or read in this inventory rather than stated in a source.

provenance:
  repository: https://github.com/solids4foam/solids4foam
  branch: development
  commit: 7c928c55
  commit_date: 2026-10-03
  inventory_date: 2026-10-03
  new_simulations_run: false
  open_prs_checked: [528, 503, 249, 233, 116]
  open_prs_with_fsi_verification_content: []
  reference_categories:
    A: analytical or semi-analytical
    B: independently converged numerical reference of the same problem
    C: classical/published benchmark with partly quantified error
    C-weak: as C, but figure-digitised, single-mesh, inconsistent, preprint or same code lineage

benchmarks:

  - id: ringAddedMass
    path: tutorials/fluidSolidInteraction/ringAddedMass
    prs: [510]
    dimension: 2D plane strain (quarter, symmetry)
    regime: transient free vibration (n=2 mode)
    fluid_model: pimpleFluid, incompressible NS, nu=1e-7 (effectively inviscid)
    solid_model: linearGeometryTotalDisplacement, PETSc SNES; cubic high-order (default) or standard
    deformation: small
    feature_tested: added mass, mass ratio mu = 0.101, 1.008, 10.08
    reference:
      category: A
      description: exact linear eigenvalue of plane-strain continuum ring with potential-flow added-mass traction (Chebyshev collocation, 24 intervals); thin-ring closed form (Brennen 1982) as check
      provenance: verification/scripts/ring_exact_frequencies.py; verification/reference/ringAddedMass_verification_references.json
      precision: collocation change ~4.6e-8
      values:
        omega_dry: 2.55504219581415
        omega_wet: {weak: 2.4356148807267943, moderate: 1.8045131724003833, strong: 0.768654490979269}
        ratio: {weak: 0.9532581828656255, moderate: 0.7062557226478153, strong: 0.30083827665880936}
        viscous_frequency_shift: {weak: -4.12e-5, moderate: -2.63e-4, strong: -7.31e-4}
    quantities_of_interest: [wet frequency, dry frequency, wet/dry ratio, amplitude loss per period]
    mesh_study: {exists: true, levels: [1, 2, 4], solid_cells: "4x48 to 16x192", fluid_cells: "12x48 to 48x192", steps_per_period: 100}
    time_step_study: {exists: true, steps_per_period: [25, 50, 100], mesh_factor: 2}
    coupling_study:
      exists: true
      description: IQN-ILS vs Robin-Neumann, mesh 2, 100 steps/period
      agreement: 0.03% in frequency
      mean_iterations: {iqnils: [2.99, 3.95, 4.91], robin: [3.87, 4.85, 12.29]}
      tolerance_sweep: false
    other_studies: [standard vs high-order solid]
    observed_orders:
      time: {dry: 1.90, weak: 1.92, moderate: 2.02, strong: 2.14}
      mesh_ratio_error: {weak: 1.77, moderate: 1.73, strong: 1.68}
      mesh_standard_solid: 1.66
      mesh_frequency_high_order: not measurable (changes <= 0.06%)
    best_values:
      setting: mesh 4, 100 steps/period, IQN-ILS, high-order
      omega: {dry: 2.55173, weak: 2.43248, moderate: 1.80224, strong: 0.76770}
      error: {dry: -0.129%, weak: -0.129%, moderate: -0.126%, strong: -0.124%}
      ratio_error: {weak: +0.001%, moderate: +0.003%, strong: +0.006%}
      richardson_time_extrapolated_error: "within +0.018%"
    independent_code_evidence: not required (exact); collocation script independent of solids4foam
    cost: {tutorial: 75 s serial, full_study: "35 runs, ~30 min with 32 concurrent serial runs", longest_run: ~25 min}
    versions_recorded: [v2412]
    limitations:
      - viscous damping not verified (Stokes layer unresolved by design)
      - IQN-ILS amplitude loss up to 2.1%/period (coarsest, strong), halves per refinement, absent with Robin; mechanism unexplained
      - v2412 only; regression half-period differs 0.05% on v2512
    unique_contribution: exact reference with added-mass ratio swept over two decades; separates time, solid and coupling errors
    strengthen: [v2512 rerun, explain IQN-ILS amplitude loss, n=3 mode and h/a sweep, quasi-monolithic solver run]
    recommendation: {section: "4.1", placement: main}

  - id: womersleyTube
