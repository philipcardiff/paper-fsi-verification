          errors_1x: {ux_mean: 21.6%, ux_amplitude: 16.4%, ux_frequency: 7.0%, uy_amplitude: 12.4%, uy_frequency: 6.9%, drag_mean: 4.6%, drag_amplitude: 13.1%, lift_amplitude: 7.9%}
          errors_2x: {ux_mean: 3.1%, ux_amplitude: 1.9%, ux_frequency: 1.8%, uy_amplitude: 1.3%, uy_frequency: 1.8%, drag_mean: 0.5%, drag_amplitude: 2.0%, lift_amplitude: 7.8%}
