        cost: {"1x": 1.2 h serial, "2x": 4.0 h on 7 ranks}
        limitations: [fluid mesh degrades (non-orthogonality 26 -> 58 deg by 10.5 s), IQN-ILS fails at 11.36 s on 2x, lift amplitude not converging (8% on both meshes)]
        recommendation: {section: "4.3", placement: main, note: with FSI3 in one table}
    independent_code_evidence: Featflow (independent monolithic FE); Tukovic 2018 values stored for information (same lineage)
    versions_recorded: [v2412 Apple M1 Ultra]
    limitations:
      - only two mesh levels in every variant
      - FSI3 lift amplitude 13.3% off at 2x
