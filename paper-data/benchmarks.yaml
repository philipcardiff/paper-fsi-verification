    dimension: axisymmetric (1 degree wedge)
    regime: time-periodic travelling wave (6 periods, last 2 analysed)
    fluid_model: pimpleFluid, viscous incompressible, Womersley number 5.01
    solid_model: linearGeometryTotalDisplacement, PETSc SNES, standard second-order (high-order fails on wedge, issue 512)
    deformation: small
    feature_tested: viscous pressure-wave propagation in thick compliant tube; non-reflecting exact travelling-wave ends
    reference:
      category: A
      description: exact linear solution, thick elastic cylinder (Chebyshev collocation, 16 intervals) + linearised full NS; free (untethered) wall
      provenance: verification/scripts/womersley_exact.py; verification/reference/womersleyTube_verification_references.json
      checks: [k8 vs k24 collocation, thin-wall limit vs Womersley/Filonova 2020 Eq. 41, tethered long-wave Lame limit to 2e-5]
      values:
        k: [0.14397837071646385, -0.020726589651181286]
        wave_speed: 0.8727957228454881
        wavelength: 43.6397861422744
        womersley_thin_wall_wave_speed: 0.9135681385326775
    quantities_of_interest: [velocity profile, flow rate amplitude and phase, wall radial displacement amplitude and phase, wave speed, attenuation]
    mesh_study: {exists: true, levels: [1, 2, 4], base: "32 axial, 10 fluid radial, 4 wall radial", steps_per_period: 200, coupling: robin}
    time_step_study: {exists: true, steps_per_period: [50, 100, 200], mesh_factor: 2}
    coupling_study:
      exists: true
      description: IQN-ILS vs Robin, mesh 2, 100 steps/period
      agreement: 3e-4 or better on every quantity
      mean_iterations: {iqnils: 14.8, robin: 8.7}
      tolerance_sweep: false
    observed_orders:
      mesh: {profile: 2.06, flow_amp: 2.16, flow_phase: 1.92, wallMid_amp: 2.15, wallMid_phase: 0.97, speed: 2.48, attenuation: 0.63}
      time: {flow_amp: 1.64, flow_phase: 1.84, wallMid_amp: 1.71, wallMid_phase: 1.74, speed: 1.29, attenuation: 1.51}
    best_values:
      setting: m4, n200, Robin
      relative_errors: {profile: 1.18e-3, flow_amp: -7.15e-4, flow_phase_rad: 1.53e-5, wallMid_amp: 8.57e-4, wallMid_phase_rad: -1.88e-3, speed: 8.93e-4, attenuation: -4.47e-3}
    independent_code_evidence: not required (exact)
    cost: {tutorial: "~4 min serial IQN-ILS, ~2 min Robin", runs: 2.5-25 min, full_study: ~30 min with 5 cores}
    versions_recorded: [v2412 macOS arm64]
    limitations:
      - time order 1.3-1.8, below nominal 2; cause unidentified
      - unexplained ~0.5% start-up transient that grows as dt decreases
      - mesh study at n200 carries a time error of similar size to the finest mesh error
      - wall phase and attenuation ~first order in space
      - untethered wall, not Womersley's constrained tube (issue 511)
      - Robin result moves 0.26% of amplitude v2412 -> v2512 (PR 513 comment), ~10x IQN-ILS sensitivity
      - OpenFOAM.com only
    checked_and_ruled_out:
      - "BDF d2dt2 start-up fix fdf9b856 (feature/bdf34-time-schemes) affects only bdfD2dt2Scheme, not backward"
    unique_contribution: exact viscous time-periodic wave-propagation reference with amplitude and phase QoIs; only axisymmetric case
    strengthen: [diagnose time order (time study on m4 or n400), v2512 rerun, tethered variant after issue 511]
    recommendation: {section: "4.1", placement: main, condition: time-order diagnosis or explicit reporting}

  - id: collapsibleChannel
    path: tutorials/fluidSolidInteraction/collapsibleChannel
    prs: [507]
    dimension: 2D
    regime: transient (ramped collapse, damped oscillation), analysed to t=1.5 s
    fluid_model: pimpleFluid, Re = Re*St = 50
    solid_model: total-Lagrangian St Venant-Kirchhoff, PETSc SNES matrix-free; cubic high-order (default) or linear reconstruction
    deformation: large
    feature_tested: very light thin bending wall, strong added mass, internal flow; partitioned robustness vs wall density
    reference:
      category: B
      description: oomph-lib monolithic Newton FE (Q2P-1 fluid, nonlinear Kirchhoff-Love beam, BDF2/Newmark); converged reference is Richardson-in-time of dt=0.003125 and 0.0015625
      provenance: verification/reference/oomph-lib/collapsible_channel_ref.cc (regenerable); verification/reference/*.csv
      precision: ~0.3% of peak (refinement 1 vs 2 0.26%; Richardson correction 0.06%; CR vs Taylor-Hood <0.001%)
      modifications_from_published_problem: [sigma0 = 0 (no pre-stress), h/a = 1/20, clamped ends, pressure ramp, regularising density rho_s = rho_f (shift 0.28% of peak)]
      model_form_difference: beam vs continuum O(h/L); static 0.05%
      values: {static_wallMid: -0.14362832, converged_first_trough: -0.2160, peak_reference_displacement: 0.216}
    quantities_of_interest: [wall-midpoint displacement history, first trough, static deflection]
    mesh_study:
      exists: true
      solid_meshes: ["80x8", "160x8", "320x8", "640x8"]
      fluid_levels: [1, 2, 3, 4]
      fluid_cells: [3200, 12800, 28800, 51200]
      fluid_errors_vs_oomph_same_dt: [4.65%, 1.43%, 0.53%, 0.50%]
    time_step_study: {exists: true, dt: [0.025, 0.0125, 0.00625, 0.003125], self_differences: [4.56%, 1.33%, 0.34%], mesh: tutorial fluid level 1}
    coupling_study:
      exists: true
      description: density sweep rho_s/rho_f 0..3 for IQN-ILS and Robin; Robin vs IQN-ILS comparison
      agreement: 0.08-0.23% of peak, does not shrink with refinement
      findings: [IQN-ILS never completes whole study, Robin completes all from rho_s/rho_f = 1]
      tolerance_sweep: false
    other_studies: [static wall linear vs cubic, solid discretisation in coupled problem]
    observed_orders:
      fluid_mesh: [1.7, 2.4, then reference floor]
      time: [1.8, 2.0]
      oomph_lib_time: [1.8, 1.9]
    best_values: {first_trough_fluid4_dt0.00625: -0.21610, error_vs_oomph: 0.50%, cubic_solid_error_tutorial_mesh: 0.44%, linear_solid_error_tutorial_mesh: 17.4%}
    independent_code_evidence: oomph-lib (independent monolithic FE)
    cost: {tutorial: ~10 min, full_sweep: ~2.5 h one case per core, largest_case: 70 min, parallel: not supported (serial-only high-order Jacobian)}
    versions_recorded: [v2412 Linux PETSc 3.24, v2412 macOS PETSc 3.22 (static)]
    limitations:
      - not the published pre-stressed massless problem
      - temporal error on finest fluid mesh not measured
      - solid fails in parallel; a 4-rank linear-reconstruction run gave a wrong displacement
      - Robin/IQN-ILS gap does not shrink with refinement
      - v2412 only
    unique_contribution: independently converged monolithic reference for large-deformation bending wall with strong added mass; partitioned failure map
    strengthen: [time study on fluid level >=3, parallel rerun after Jacobian fix, quasi-monolithic run with massless wall]
    recommendation: {section: "4.2", placement: main}

